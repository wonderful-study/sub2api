name: Release On Version Change

on:
  push:
    branches:
      - main
    paths:
      - backend/cmd/server/VERSION
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  tag:
    if: ${{ (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'Merge pull request')) || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'sync/upstream-v')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD_REF="${{ github.event.pull_request.head.ref }}"
            TAG="${HEAD_REF#sync/upstream-}"
            if [ "$TAG" = "$HEAD_REF" ]; then
              echo "Unable to resolve release tag from ${HEAD_REF}" >&2
              exit 1
            fi
          else
            VERSION="$(tr -d '\r\n' < backend/cmd/server/VERSION)"
            if [ -z "$VERSION" ]; then
              echo "VERSION is empty" >&2
              exit 1
            fi
            TAG="v${VERSION#v}"
          fi

          if [ -z "$TAG" ]; then
            echo "Unable to resolve release tag" >&2
            exit 1
          fi
          TAG="v${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create release tag if missing
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "${TAG} already exists"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release ${TAG}"
          git push origin "$TAG"

      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          SIMPLE_RELEASE: ${{ vars.SIMPLE_RELEASE || 'false' }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
            exit 0
          fi

          simple_release=false
          if [ "$SIMPLE_RELEASE" = "true" ]; then
            simple_release=true
          fi

          gh workflow run release.yml \
            --ref "${{ github.event.repository.default_branch }}" \
            -f "tag=${TAG}" \
            -f "simple_release=${simple_release}" \
            -f "auto_deploy=true"
